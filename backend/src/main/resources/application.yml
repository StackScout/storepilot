spring:
  # Locally, src/main/resources/config.yml (gitignored, see .gitignore)
  # supplies the env-var-named properties below (DB_*, PAYHERE_*, etc.)
  # when it exists. It lives beside this file for easy reference, but is
  # loaded by direct filesystem path rather than `classpath:` — and is
  # excluded from processResources in build.gradle.kts — specifically so
  # it's never copied into build/ or packaged into the jar. `./gradlew
  # bootRun` runs with backend/ as the working directory, hence the
  # ./src/main/resources/ prefix here. In production this file doesn't
  # exist (never deployed), so these same env var names must be set for
  # real there — on AWS, infra/docker/bootstrap.sh fetches them from SSM
  # Parameter Store and writes them into the container's environment before
  # `docker compose up`. "optional:" means boot doesn't fail when the file
  # is absent.
  config:
    import: "optional:file:./src/main/resources/config.yml"
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/islandcart}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (see db/migration) — Hibernate only ever
      # validates the mapped entities match it, never auto-generates DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${COGNITO_REGION:ap-south-1}.amazonaws.com/${COGNITO_USER_POOL_ID}

server:
  port: ${PORT:8080}
  # Behind Caddy in production, the connection Spring sees is plain HTTP
  # inside the docker network even though the outside world is HTTPS —
  # without this, request.isSecure() (used to set the auth cookies' Secure
  # flag) would always read false. Caddy sets X-Forwarded-Proto by default.
  forward-headers-strategy: framework

# Origins allowed to call /api/** (WebConfig) — comma-separated. Add the
# deployed frontend's origin here in production; localhost:3000 stays as a
# safe default for local dev.
app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap values only — read once by DataSeeder to insert the single
# platform_settings row if it doesn't exist yet (see PlatformSettings.kt and
# PlatformProperties.kt's doc comments). After that first insert, the
# running app reads the DB row, not these values, so editing this block
# after go-live has no effect — update the platform_settings row instead.
# Defaults below are Australia's — the near-term deployment target while
# the Sri Lanka launch is on hold (see PlatformProperties.kt) — so leaving
# these unset boots an AU-configured platform; a Sri Lanka deployment
# overrides these via env vars instead.
platform:
  name: ${PLATFORM_NAME:IslandCart}
  tagline: ${PLATFORM_TAGLINE:Australia's marketplace for small business sellers}
  country-name: ${PLATFORM_COUNTRY_NAME:Australia}
  country-code: ${PLATFORM_COUNTRY_CODE:AU}
  currency-code: ${PLATFORM_CURRENCY_CODE:AUD}
  currency-symbol: ${PLATFORM_CURRENCY_SYMBOL:$}
  currency-locale: ${PLATFORM_CURRENCY_LOCALE:en-AU}
  platform-fee-percent: ${PLATFORM_FEE_PERCENT:3.5}
  flat-shipping-fee: ${PLATFORM_FLAT_SHIPPING_FEE:10}
  default-cod-enabled: ${PLATFORM_DEFAULT_COD_ENABLED:true}
  default-online-payment-enabled: ${PLATFORM_DEFAULT_ONLINE_PAYMENT_ENABLED:false}
  default-bank-transfer-enabled: ${PLATFORM_DEFAULT_BANK_TRANSFER_ENABLED:true}
  support-email: ${SUPPORT_EMAIL:hello@islandcart.au}
  company-location: ${COMPANY_LOCATION:Sydney, Australia}

# Shared AWS SDK config — only meaningful under the aws profile (S3/SES clients).
aws:
  region: ${AWS_REGION:us-east-1}

# Cognito is the authorization server in every environment (not aws-profile
# gated — there's no local/mock auth implementation, unlike S3/SES). Local
# dev needs real AWS credentials with Cognito permissions on this pool (see
# config.yml / the islandcart-dev CLI profile), since there's no emulator.
cognito:
  region: ${COGNITO_REGION:ap-south-1}
  user-pool-id: ${COGNITO_USER_POOL_ID}
  client-id: ${COGNITO_CLIENT_ID}
  oauth-domain: ${COGNITO_OAUTH_DOMAIN:}
  oauth-client-id: ${COGNITO_OAUTH_CLIENT_ID:}
  oauth-client-secret: ${COGNITO_OAUTH_CLIENT_SECRET:}
  oauth-redirect-uri: ${COGNITO_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# ReceiptStorageService: upload-dir/public-path are local-profile-only
# (upload-dir is relative to the working directory unless absolute);
# s3-bucket-name is aws-profile-only.
receipts:
  upload-dir: ${RECEIPTS_UPLOAD_DIR:uploads/receipts}
  public-path: /uploads/receipts
  s3-bucket-name: ${RECEIPTS_S3_BUCKET_NAME:}

# FileStorageService: general-purpose uploads (seller verification documents,
# product images, courier receipts) — same local/aws split as receipts above,
# kept in a separate bucket/root so its lifecycle isn't tied to receipts.
file-storage:
  upload-dir: ${FILE_STORAGE_UPLOAD_DIR:uploads/files}
  public-path: /uploads/files
  s3-bucket-name: ${FILE_STORAGE_S3_BUCKET_NAME:}

# Sandbox by default — see docs/features/payhere-checkout.md. notify-url
# must be a publicly reachable URL (PayHere never calls localhost), so local
# sandbox testing needs a tunnel (ngrok etc.) pointed at this backend, with
# PAYHERE_NOTIFY_URL set to the tunnel's URL.
payhere:
  merchant-id: ${PAYHERE_MERCHANT_ID}
  merchant-secret: ${PAYHERE_MERCHANT_SECRET}
  sandbox: ${PAYHERE_SANDBOX:true}
  notify-url: ${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/payhere/notify}
  return-url-base: ${PAYHERE_RETURN_URL_BASE:http://localhost:3000/orders}

# Email notifications — LoggingEmailService (mock, logs only) by default;
# SesEmailService under the aws profile, which needs ses-sender-email to be
# an SES-verified address. reminder-check-interval-ms controls how often
# the scheduler ticks; first-reminder-after-hours / reminder-interval-hours
# control per-order throttling.
notifications:
  frontend-base-url: ${NOTIFICATIONS_FRONTEND_BASE_URL:http://localhost:3000}
  first-reminder-after-hours: ${NOTIFICATIONS_FIRST_REMINDER_AFTER_HOURS:6}
  reminder-interval-hours: ${NOTIFICATIONS_REMINDER_INTERVAL_HOURS:24}
  reminder-check-interval-ms: ${NOTIFICATIONS_REMINDER_CHECK_INTERVAL_MS:3600000}
  ses-sender-email: ${NOTIFICATIONS_SES_SENDER_EMAIL:}
  admin-notification-email: ${NOTIFICATIONS_ADMIN_EMAIL:admin@islandcart.test}

management:
  endpoints:
    web:
      exposure:
        include: health,info
