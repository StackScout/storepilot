AWSTemplateFormatVersion: "2010-09-09"
Description: >
  StorePilot — the single EC2 instance running the whole stack via Docker
  Compose (Postgres + backend + frontend + Caddy). Depends on security.yaml
  and iam.yaml (imports their exports) — deploy those first. UserData only
  installs Docker and writes the .env file (secrets pulled from SSM); it
  does NOT start the app — code isn't on the instance yet at boot time, see
  scripts/sync-and-deploy.sh.

Parameters:
  EnvironmentName:
    Type: String
    Default: storepilot-test
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      A public subnet in your default VPC (find one with: aws ec2
      describe-subnets --filters Name=vpc-id,Values=<VpcId> --query
      "Subnets[0].SubnetId").
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: An EC2 key pair you've already created, for SSH access.
  InstanceType:
    Type: String
    Default: t3.small
    Description: >
      t3.micro (1GB RAM) is too small for Postgres + a JVM + Node running
      together — see infra/README.md.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  # What makes this stack a distinct country's platform (e.g. a separate
  # Australia deployment alongside a future Sri Lanka one, same template,
  # same code) — read once at boot by DataSeeder to seed the DB-backed
  # platform_settings row (see backend/.../common/PlatformProperties.kt and
  # PlatformSettings.kt). Defaults below are Australia's — the near-term
  # deployment target while the Sri Lanka launch is on hold; a Sri Lanka
  # stack overrides these instead.
  PlatformName:
    Type: String
    Default: StorePilot
  PlatformTagline:
    Type: String
    Default: Australia's marketplace for small business sellers
  PlatformCountryName:
    Type: String
    Default: Australia
  PlatformCountryCode:
    Type: String
    Default: AU
  PlatformCurrencyCode:
    Type: String
    Default: AUD
  PlatformCurrencySymbol:
    Type: String
    Default: "$"
  PlatformCurrencyLocale:
    Type: String
    Default: en-AU
  PlatformFeePercent:
    Type: String
    Default: "3.5"
  PlatformFlatShippingFee:
    Type: String
    Default: "10"
  PlatformDefaultCodEnabled:
    Type: String
    Default: "true"
  PlatformDefaultOnlinePaymentEnabled:
    Type: String
    Default: "false"
  PlatformDefaultBankTransferEnabled:
    Type: String
    Default: "true"
  SupportEmail:
    Type: String
    Default: hello@storepilot.au
  CompanyLocation:
    Type: String
    Default: Sydney, Australia
  # Cognito is a separate, manually-created resource (not managed by any
  # CFN template here — see infra/README.md's auth section) and is reused
  # across every country deployment rather than recreated per-region: it's
  # just an API the backend calls, so it doesn't need to live in the same
  # region as this instance. The two OAuth values (client id/secret) are
  # not parameters — they're pulled from SSM in UserData below, alongside
  # the other put-secrets.sh secrets.
  CognitoRegion:
    Type: String
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CognitoOauthDomain:
    Type: String

Resources:
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      IamInstanceProfile:
        Fn::ImportValue: !Sub "${EnvironmentName}-InstanceProfileName"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${EnvironmentName}-SecurityGroupId"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-instance"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # --- Swap file — t3.small's 2GB RAM isn't enough headroom for
          # building the backend (Gradle/Kotlin) and frontend (Next.js)
          # images, which `docker compose ... up --build` builds
          # concurrently by default; without this the OOM killer/swap
          # thrashing can make the instance unresponsive (even SSH stops
          # answering). scripts/sync-and-deploy.sh and deploy.yml also
          # build the two images sequentially instead of relying on this
          # alone — belt and suspenders. ---
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
          fi

          # --- Docker + Compose plugin ---
          dnf install -y docker
          systemctl enable --now docker
          usermod -aG docker ec2-user
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # AL2023's dnf-packaged docker bundles an old buildx (0.12.x) that
          # `docker compose build` rejects ("requires buildx 0.17.0 or
          # later") — install a current one the same way as compose above.
          # Buildx's release assets are versioned in the filename (unlike
          # compose's), so resolve the latest tag via the GitHub API first.
          BUILDX_URL=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest \
            | grep browser_download_url | grep 'linux-amd64"' | cut -d'"' -f4)
          curl -SL "$BUILDX_URL" -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          # --- App directory (code is rsynced here later by
          # scripts/sync-and-deploy.sh, run from your own machine) ---
          mkdir -p /opt/storepilot/infra/docker

          # --- Derive this instance's public origin from its own Elastic
          # IP via the sslip.io trick, so Caddy can get a real Let's
          # Encrypt cert with no domain purchase or Route53 hosted zone
          # needed (see infra/README.md). ---
          PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          SITE_HOST="$(echo "$PUBLIC_IP" | tr '.' '-').sslip.io"
          SITE_ADDRESS="https://$SITE_HOST"

          # --- Secrets from SSM Parameter Store — put there ahead of time
          # by scripts/put-secrets.sh (CloudFormation itself can't create
          # SecureString parameters natively, see infra/README.md). Scoped
          # per-environment (/storepilot/${EnvironmentName}/*) so a second
          # deployment (e.g. Australia) under a different EnvironmentName
          # doesn't read or collide with this one's secrets. ---
          # Falls back to "" for a parameter put-secrets.sh skipped writing
          # (it doesn't write empty-valued secrets, since SSM rejects them)
          # — matches application.yml's own empty-string-means-unconfigured
          # defaults for optional secrets like Stripe/ABR.
          get_param() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text --region ${AWS::Region} 2>/dev/null || echo ""; }
          SSM_PREFIX="/storepilot/${EnvironmentName}"

          cat > /opt/storepilot/infra/docker/.env <<EOF
          DB_USERNAME=$(get_param $SSM_PREFIX/db-username)
          DB_PASSWORD=$(get_param $SSM_PREFIX/db-password)
          PAYHERE_MERCHANT_ID=$(get_param $SSM_PREFIX/payhere-merchant-id)
          PAYHERE_MERCHANT_SECRET=$(get_param $SSM_PREFIX/payhere-merchant-secret)
          PAYHERE_SANDBOX=true
          PAYHERE_NOTIFY_URL=$SITE_ADDRESS/api/payments/payhere/notify
          PAYHERE_RETURN_URL_BASE=$SITE_ADDRESS/orders
          STRIPE_SECRET_KEY=$(get_param $SSM_PREFIX/stripe-secret-key)
          STRIPE_PUBLISHABLE_KEY=$(get_param $SSM_PREFIX/stripe-publishable-key)
          STRIPE_WEBHOOK_SECRET=$(get_param $SSM_PREFIX/stripe-webhook-secret)
          STRIPE_SUCCESS_URL_BASE=$SITE_ADDRESS/orders
          STRIPE_CANCEL_URL_BASE=$SITE_ADDRESS/orders
          STRIPE_BILLING_WEBHOOK_SECRET=$(get_param $SSM_PREFIX/stripe-billing-webhook-secret)
          STRIPE_BILLING_SUCCESS_URL_BASE=$SITE_ADDRESS/dashboard/settings
          STRIPE_BILLING_CANCEL_URL_BASE=$SITE_ADDRESS/dashboard/settings
          ABR_GUID=$(get_param $SSM_PREFIX/abr-guid)
          SES_SENDER_EMAIL=$(get_param $SSM_PREFIX/ses-sender-email)
          AWS_REGION=${AWS::Region}
          ENVIRONMENT_NAME=${EnvironmentName}
          RECEIPTS_S3_BUCKET_NAME=${EnvironmentName}-receipts
          FILE_STORAGE_S3_BUCKET_NAME=${EnvironmentName}-file-storage
          SITE_ADDRESS=$SITE_ADDRESS
          FRONTEND_ORIGIN=$SITE_ADDRESS
          BACKEND_ORIGIN=$SITE_ADDRESS
          COGNITO_REGION=${CognitoRegion}
          COGNITO_USER_POOL_ID=${CognitoUserPoolId}
          COGNITO_CLIENT_ID=${CognitoClientId}
          COGNITO_OAUTH_DOMAIN=${CognitoOauthDomain}
          COGNITO_OAUTH_CLIENT_ID=$(get_param $SSM_PREFIX/cognito-oauth-client-id)
          COGNITO_OAUTH_CLIENT_SECRET=$(get_param $SSM_PREFIX/cognito-oauth-client-secret)
          COGNITO_OAUTH_REDIRECT_URI=$SITE_ADDRESS/api/auth/google/callback
          PLATFORM_NAME=${PlatformName}
          PLATFORM_TAGLINE=${PlatformTagline}
          PLATFORM_COUNTRY_NAME=${PlatformCountryName}
          PLATFORM_COUNTRY_CODE=${PlatformCountryCode}
          PLATFORM_CURRENCY_CODE=${PlatformCurrencyCode}
          PLATFORM_CURRENCY_SYMBOL=${PlatformCurrencySymbol}
          PLATFORM_CURRENCY_LOCALE=${PlatformCurrencyLocale}
          PLATFORM_FEE_PERCENT=${PlatformFeePercent}
          PLATFORM_FLAT_SHIPPING_FEE=${PlatformFlatShippingFee}
          PLATFORM_DEFAULT_COD_ENABLED=${PlatformDefaultCodEnabled}
          PLATFORM_DEFAULT_ONLINE_PAYMENT_ENABLED=${PlatformDefaultOnlinePaymentEnabled}
          PLATFORM_DEFAULT_BANK_TRANSFER_ENABLED=${PlatformDefaultBankTransferEnabled}
          SUPPORT_EMAIL=${SupportEmail}
          COMPANY_LOCATION=${CompanyLocation}
          EOF

          chown -R ec2-user:ec2-user /opt/storepilot
          echo "Bootstrap complete. Public origin: $SITE_ADDRESS"
          echo "Next: run scripts/sync-and-deploy.sh from your machine to ship the code and start the stack."

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-eip"

Outputs:
  PublicIp:
    Value: !Ref ElasticIp
  SiteAddress:
    Description: The app's public HTTPS address once scripts/sync-and-deploy.sh has run.
    Value: !Sub
      - "https://${DashedIp}.sslip.io"
      - DashedIp: !Join ["-", !Split [".", !Ref ElasticIp]]
  InstanceId:
    Description: >
      Consumed by cicd.yaml to scope the GitHub Actions deploy role's SSM
      permissions to this exact instance. Outputs-only addition — never add
      a property here that would force an instance replacement (this
      instance's Postgres data lives in a Docker volume on its own root EBS
      volume with DeleteOnTermination: true, no RDS/snapshot behind it).
    Value: !Ref Instance
    Export:
      Name: !Sub "${EnvironmentName}-InstanceId"
