AWSTemplateFormatVersion: "2010-09-09"
Description: >
  StorePilot — EC2 instance role/profile, least-privilege for exactly what
  the backend needs: read/write the receipts bucket, read SSM parameters
  under /storepilot/*, send email via SES, read deploy tarballs from the
  CI deploy bucket. Also carries the AWS-managed SSM Core policy so the
  GitHub Actions deploy workflow can reach this instance via SSM
  RunCommand (see cicd.yaml) instead of SSH. Depends on storage.yaml
  (imports its bucket ARNs) — deploy storage.yaml first.

Parameters:
  EnvironmentName:
    Type: String
    Default: storepilot-test
  CognitoRegion:
    Type: String
    Description: >
      Region of the Cognito user pool the backend's AuthController calls
      via Admin* APIs (AdminCreateUser, AdminInitiateAuth, ...) — may
      differ from this stack's own region, since Cognito is reused across
      deployments rather than recreated per-region.
  CognitoUserPoolId:
    Type: String
    Description: The Cognito user pool ID the instance role is scoped to call Admin* actions against.

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets the preinstalled SSM agent (AL2023 ships it by default)
        # register with Systems Manager and receive RunCommand
        # invocations — without this the agent is present but inert.
        # Attaching it doesn't require a reboot; the agent self-registers
        # within a few minutes of the permission appearing.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: receipts-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn: !ImportValue
                      Fn::Sub: "${EnvironmentName}-ReceiptsBucketArn"
        - PolicyName: file-storage-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn: !ImportValue
                      Fn::Sub: "${EnvironmentName}-FileStorageBucketArn"
        - PolicyName: ssm-parameter-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/storepilot/*"
        - PolicyName: ses-send
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                # SES doesn't expose a per-identity ARN until a sender
                # address/domain is verified — tighten this to that
                # identity's ARN once you know it (see infra/README.md).
                Resource: "*"
        - PolicyName: ci-deploy-bucket-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn: !ImportValue
                      Fn::Sub: "${EnvironmentName}-CiDeployBucketArn"
        - PolicyName: cognito-admin-actions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  # Exactly the Admin* calls AuthController.kt makes on the
                  # buyer/seller/admin's behalf — no end-user-facing Cognito
                  # actions, no wildcard cognito-idp:*.
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminUserGlobalSignOut
                  # Flips email_verified to true once EmailVerificationService's
                  # 6-digit code checks out — see AuthController.verifyEmail().
                  - cognito-idp:AdminUpdateUserAttributes
                  # Completes the SOFTWARE_TOKEN_MFA challenge AdminInitiateAuth
                  # returns for a user who's enrolled TOTP — see AuthController
                  # .mfaChallenge(). AssociateSoftwareToken/VerifySoftwareToken/
                  # SetUserMFAPreference/GetUser (self-service enrollment) are
                  # NOT here deliberately — those are called with the end
                  # user's own access token, authorized by Cognito's app
                  # client, not by this role's IAM identity.
                  - cognito-idp:AdminRespondToAuthChallenge
                  # Buyer/seller self-service account deletion — see
                  # BuyerAccountService.deleteCurrentBuyer()/
                  # SellerAccountService.deleteCurrentSeller(), called after
                  # AdminUserGlobalSignOut above.
                  - cognito-idp:AdminDeleteUser
                  # GET /api/admin/admins — lists every Cognito user in the
                  # admin group, including ones who haven't signed in yet
                  # (so no corresponding Admin DB row exists to query
                  # instead) — see AdminManagementService. Not an
                  # Admin*-prefixed API name despite needing the same
                  # backend-credential trust as the rest of this policy.
                  - cognito-idp:ListUsersInGroup
                Resource: !Sub "arn:aws:cognito-idp:${CognitoRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
        - PolicyName: docker-awslogs-driver
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                # Docker's built-in `awslogs` logging driver runs inside
                # the host's dockerd process and picks up these instance
                # role credentials automatically via IMDS — no separate
                # CloudWatch agent needed. Scoped to this environment's
                # own log group only (see docker-compose.prod.yml).
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/storepilot/${EnvironmentName}*:*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-instance-profile"
      Roles:
        - !Ref InstanceRole

Outputs:
  InstanceProfileName:
    Value: !Ref InstanceProfile
    Export:
      Name: !Sub "${EnvironmentName}-InstanceProfileName"
