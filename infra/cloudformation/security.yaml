AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IslandCart — security group for the single test EC2 instance. SSH is
  restricted to a CIDR you supply (your own IP); HTTP/HTTPS are open since
  this is a public test site.

Parameters:
  EnvironmentName:
    Type: String
    Default: islandcart-test
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      Your account's default VPC (find it with: aws ec2 describe-vpcs
      --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId").
  SshAllowedCidr:
    Type: String
    Description: >
      Your IP in CIDR form, e.g. 203.0.113.4/32 (find it with: curl -s
      ifconfig.me). No default — do not open SSH to the world.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-sg"
      GroupDescription: IslandCart test instance — SSH (restricted), HTTP/HTTPS (public)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshAllowedCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: islandcart

Outputs:
  SecurityGroupId:
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub "${EnvironmentName}-SecurityGroupId"
