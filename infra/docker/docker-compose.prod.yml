# Runs on the EC2 instance (see ../cloudformation/compute.yaml). All secret
# values come from the .env file bootstrap.sh writes from SSM Parameter
# Store — never hardcoded here, never committed. Deployed via
# ../scripts/sync-and-deploy.sh, which rsyncs the repo to the instance and
# runs `docker compose -f infra/docker/docker-compose.prod.yml up -d --build`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: storepilot
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Loopback-only — never 0.0.0.0. Reachable from your machine via an
      # SSH tunnel through the instance (see infra/README.md), not directly
      # over the internet; security.yaml's security group doesn't open 5432
      # either, so this is belt-and-suspenders.
      - "127.0.0.1:5432:5432"
    volumes:
      - storepilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: aws
      DB_URL: jdbc:postgresql://postgres:5432/storepilot
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-true}
      PAYHERE_NOTIFY_URL: ${PAYHERE_NOTIFY_URL}
      PAYHERE_RETURN_URL_BASE: ${PAYHERE_RETURN_URL_BASE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL_BASE: ${STRIPE_SUCCESS_URL_BASE}
      STRIPE_CANCEL_URL_BASE: ${STRIPE_CANCEL_URL_BASE}
      STRIPE_BILLING_WEBHOOK_SECRET: ${STRIPE_BILLING_WEBHOOK_SECRET}
      STRIPE_BILLING_SUCCESS_URL_BASE: ${STRIPE_BILLING_SUCCESS_URL_BASE}
      STRIPE_BILLING_CANCEL_URL_BASE: ${STRIPE_BILLING_CANCEL_URL_BASE}
      ABR_GUID: ${ABR_GUID}
      NOTIFICATIONS_FRONTEND_BASE_URL: ${FRONTEND_ORIGIN}
      NOTIFICATIONS_SES_SENDER_EMAIL: ${SES_SENDER_EMAIL}
      AWS_REGION: ${AWS_REGION}
      RECEIPTS_S3_BUCKET_NAME: ${RECEIPTS_S3_BUCKET_NAME}
      FILE_STORAGE_S3_BUCKET_NAME: ${FILE_STORAGE_S3_BUCKET_NAME}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_OAUTH_DOMAIN: ${COGNITO_OAUTH_DOMAIN}
      COGNITO_OAUTH_CLIENT_ID: ${COGNITO_OAUTH_CLIENT_ID}
      COGNITO_OAUTH_CLIENT_SECRET: ${COGNITO_OAUTH_CLIENT_SECRET}
      COGNITO_OAUTH_REDIRECT_URI: ${COGNITO_OAUTH_REDIRECT_URI}
      # Bootstrap-only — read once by DataSeeder to insert the single
      # platform_settings row if it's missing (see PlatformProperties.kt's
      # doc comment); the running app reads that DB row afterward, not
      # these env vars. Defaults below are Australia's, the near-term
      # deployment target while the Sri Lanka launch is on hold — a Sri
      # Lanka deployment overrides these instead.
      PLATFORM_NAME: ${PLATFORM_NAME:-StorePilot}
      PLATFORM_TAGLINE: ${PLATFORM_TAGLINE:-Australia's marketplace for small business sellers}
      PLATFORM_COUNTRY_NAME: ${PLATFORM_COUNTRY_NAME:-Australia}
      PLATFORM_COUNTRY_CODE: ${PLATFORM_COUNTRY_CODE:-AU}
      PLATFORM_CURRENCY_CODE: ${PLATFORM_CURRENCY_CODE:-AUD}
      PLATFORM_CURRENCY_SYMBOL: ${PLATFORM_CURRENCY_SYMBOL:-$$}
      PLATFORM_CURRENCY_LOCALE: ${PLATFORM_CURRENCY_LOCALE:-en-AU}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-3.5}
      PLATFORM_FLAT_SHIPPING_FEE: ${PLATFORM_FLAT_SHIPPING_FEE:-10}
      PLATFORM_DEFAULT_COD_ENABLED: ${PLATFORM_DEFAULT_COD_ENABLED:-true}
      PLATFORM_DEFAULT_ONLINE_PAYMENT_ENABLED: ${PLATFORM_DEFAULT_ONLINE_PAYMENT_ENABLED:-false}
      PLATFORM_DEFAULT_BANK_TRANSFER_ENABLED: ${PLATFORM_DEFAULT_BANK_TRANSFER_ENABLED:-true}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@storepilot.au}
      COMPANY_LOCATION: ${COMPANY_LOCATION:-Sydney, Australia}
    # No AWS access key/secret here — the container inherits the EC2
    # instance role's credentials via the SDK's default provider chain.
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /storepilot/${ENVIRONMENT_NAME}
        tag: "backend"
        awslogs-create-group: "true"

  frontend:
    build:
      context: ../../app
      args:
        # Country content (platform name, currency, states, fees, ...) comes
        # from the backend's platform_settings/states tables at runtime, via
        # GET /api/platform-config and GET /api/states (see
        # app/src/lib/platform-config.ts), not a NEXT_PUBLIC_* build arg —
        # that's what lets the same built image serve any country, only the
        # backend's DB differs. NEXT_PUBLIC_COGNITO_* below is the exception:
        # proxy.ts's own JWT verification needs the Cognito issuer at build
        # time (see Dockerfile's comment) — same values as the backend's
        # COGNITO_REGION/COGNITO_USER_POOL_ID env vars above.
        NEXT_PUBLIC_API_URL: ${BACKEND_ORIGIN}
        NEXT_PUBLIC_COGNITO_REGION: ${COGNITO_REGION}
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /storepilot/${ENVIRONMENT_NAME}
        tag: "frontend"
        awslogs-create-group: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # --env-file only feeds Compose-level ${VAR} interpolation, not every
      # container's actual runtime env — Caddy resolves {$SITE_ADDRESS} in
      # the Caddyfile itself at its own process runtime, so it must be
      # passed through explicitly or it resolves empty, leaving a bare `{`
      # that Caddy misparses as the global options block instead of a site
      # block ("unrecognized global option: handle").
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /storepilot/${ENVIRONMENT_NAME}
        tag: "caddy"
        awslogs-create-group: "true"

volumes:
  storepilot-postgres-data:
  caddy-data:
  caddy-config:
